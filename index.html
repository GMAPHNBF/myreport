<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Arrears Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1c2433;--mu:#6b7585;--bd:#e2e6ee;--pr:#2457d6;--s1:#2e9e6b;--s2:#e69a1c;--s3:#d6453d}
@media(prefers-color-scheme:dark){:root{--bg:#0f141d;--card:#18202e;--tx:#e8ecf3;--mu:#929db0;--bd:#2a3446;--pr:#6c93ff;--s1:#43c28a;--s2:#f0b04a;--s3:#ef6a62}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}small,.mu{color:var(--mu)}
main{padding:18px 22px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;border-left:4px solid var(--pr)}
.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{font-size:12px;color:var(--mu)}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button:hover{filter:brightness(.95)}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--bd);cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}.bar .l{width:92px;font-size:12.5px}.bar .t{flex:1;background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}.bar .v{width:150px;text-align:right;font-size:12px}
.tw{overflow:auto;max-height:620px;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 9px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--card);cursor:pointer;z-index:1}td.n,th.n{text-align:right}
tr.dn td{opacity:.55}.tag{padding:2px 8px;border-radius:99px;color:#fff;font-size:11.5px}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.fl{background:#7a5af8}
.look{border-left:4px solid var(--pr)}.look .r{display:flex;flex-wrap:wrap;gap:22px;margin-top:8px}.look .r div span{display:block;font-size:11.5px;color:var(--mu)}
h3{margin:0 0 8px;font-size:14px}.pg{display:flex;gap:8px;align-items:center;margin-top:8px}
</style></head><body>
<header><div><h1>HNB Finance – Arrears Dashboard</h1><small id="meta"></small></div>
<div class="f"><label>Branch Wise RentalArrears (.xlsx)<input type="file" id="fa" accept=".xlsx,.xls"></label>
<label>Destinity LE DailySummary (.xlsx)<input type="file" id="fb" accept=".xlsx,.xls"></label>
<button class="p" id="go">Upload &amp; Replace</button></div></header>
<main>
<div class="card look" id="look"><h3>Fac No Search</h3><div class="f"><input id="fq" placeholder="Fac No (e.g. VF250201107747)" size="30"><button id="fgo" class="p">Check</button></div><div id="lres" class="mu" style="margin-top:8px">Fac No type karala Check click karanna – Stage, Arrears, Done status penwai.</div></div>
<div class="kpis" id="kpis"></div>
<div class="card"><div class="f">
<label>Mkt Officer<select id="mk"></select></label>
<label>Stage<select id="st"><option value="">All</option><option>1</option><option>2</option><option>3</option></select></label>
<label>Fac Age (Fac No)<select id="vt"><option value="">All</option><option value="L">Last 12 Months</option><option value="A">After 12 Months</option></select></label>
<label>Flag<select id="fg"><option value="">All</option><option value="R1">1st Rental</option><option value="PN">PNPL</option><option value="ADV">Advance &gt; 0</option></select></label>
<label>Done<select id="dn"><option value="">All</option><option value="1">Done</option><option value="0">Not Done</option></select></label>
<label>PNPL days from<input type="number" id="p1" style="width:80px"></label><label>to<input type="number" id="p2" style="width:80px"></label>
<label>Search<input id="q" placeholder="Name / Reg No / Fac No"></label>
<button id="rs">Reset</button></div>
<div class="chips" id="bk"></div><small class="mu" id="pnote"></small></div>
<div class="g2"><div class="card"><h3>Stage wise</h3><div id="c1"></div></div><div class="card"><h3>Arrears Bucket wise (click to filter)</h3><div id="c2"></div></div></div>
<div class="card"><div class="f" style="justify-content:space-between"><h3>Mkt Officer wise summary</h3><button id="e2">⬇ Excel</button></div><div class="tw" style="max-height:340px"><table id="ot"></table></div></div>
<div class="card"><div class="f" style="justify-content:space-between"><h3 id="th">Customers</h3><div class="f"><button id="e1" class="p">⬇ Download filtered (Excel)</button><button id="e3">⬇ Bucket summary (Excel)</button></div></div>
<div class="tw"><table id="tb"></table></div><div class="pg"><button id="pv">◀</button><span id="pi"></span><button id="nx">▶</button></div></div>
</main>

["mk","st","vt","fg","dn","p1","p2","q"].forEach(function(i){$(i).oninput=function(){page=0;draw()}});

function tg(e){var c=e.target.closest("[data-i]");if(c){var i=c.dataset.i;if(bkSel[i])delete bkSel[i];else bkSel[i]=1;page=0;draw()}}
$("bk").onclick=tg;$("c2").onclick=tg;
$("tb").onclick=function(e){var t=e.target;if(t.dataset.f){setDone(t.dataset.f,t.checked);draw();return}if(t.tagName=="TH"&&t.dataset.k){if(sortK==t.dataset.k)sortD*=-1;else{sortK=t.dataset.k;sortD=-1}draw()}};
$("pv").onclick=function(){if(page>0){page--;table(filt(false))}};$("nx").onclick=function(){page++;table(filt(false))};
$("fgo").onclick=look;$("fq").onkeydown=function(e){if(e.key=="Enter")look()};
function rd(f){return new Promise(function(ok){var fr=new FileReader();fr.onload=function(){ok(XLSX.read(fr.result,{type:"array",cellDates:true}))};fr.readAsArrayBuffer(f)})}
function grid(wb){return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}
function fnd(g,n){for(var i=0;i<Math.min(g.length,30);i++)if(g[i].some(function(c){return String(c).replace(/\s+/g,"").toLowerCase()===n}))return i;return -1}
function nm(x){return String(x==null?"":x).replace(/\s+/g," ").trim()}
function iso(d){return d instanceof Date?d.toISOString().slice(0,10):(d||"")}
$("go").onclick=function(){
 var A=$("fa").files[0],B=$("fb").files[0];if(!A||!B){alert("Excel files deka ma select karanna.");return}
 Promise.all([rd(A),rd(B)]).then(function(w){
  var ga=grid(w[0]),gb=grid(w[1]),ha=fnd(ga,"facno"),hb=fnd(gb,"facno");
  if(ha<0||hb<0){alert("FACNo / Fac No header eka hambuna ne. Files wenas wela da balanna.");return}
  var ca={};ga[ha].forEach(function(c,i){if(c!=null)ca[nm(c)]=i});var cb={};gb[hb].forEach(function(c,i){if(c!=null)cb[nm(c)]=i});
  var pm={};gb.slice(hb+1).forEach(function(r){var f=nm(r[cb["Fac No"]]);if(f)pm[f]={p:+r[cb["Portfolio"]]||0,a:+r[cb["Advance"]]||0}});
  var at=null;ga.slice(0,10).forEach(function(r){r.forEach(function(c){var m=/As at\s*:\s*(\d\d)-(\d\d)-(\d{4})/i.exec(String(c));if(m)at=new Date(m[3]+"-"+m[2]+"-"+m[1])})});
  var rows=[];ga.slice(ha+1).forEach(function(r){var f=nm(r[ca["FACNo"]]);if(!f||f.length<8)return;var p=pm[f]||{p:0,a:0};
   rows.push({fac:f,name:nm(r[ca["Name"]]),reg:nm(r[ca["Reg No"]]),town:nm(r[ca["Town"]]),nos:+r[ca["No Of O/S"]]||0,rent:+r[ca["Rental Arrears"]]||0,tot:+r[ca["Total Arrears"]]||0,days:+r[ca["Arrears Days"]]||0,grant:iso(r[ca["Grant Date"]]),lpd:iso(r[ca["Last Paid Date"]]),tel:nm(r[ca["Tel Office Home"]]),mkt:nm(r[ca["Mkt Officer"]]),fu:nm(r[ca["Follow up Officer"]]),port:p.p,adv:p.a})});
  load({asAt:at?at.toISOString():null,rows:rows});alert(rows.length+" facilities load una.")}).catch(function(e){alert("Error: "+e)})};
load(DATA);
</script></body></html>
